# Render Blueprint: deploys the built PWA as a static site.
# In Render: New → Blueprint → pick this repo → Apply. Auto-deploys on push.
services:
  - type: web
    name: fitblueprint
    runtime: static
    branch: claude/training-schedule-ux-7de11g
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional cloud sync — set the values in the Render dashboard, never commit them.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      # The service worker and the shell must always be re-checked so a new deploy shows up.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Hashed build assets and fonts never change under the same name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # MCP server for ChatGPT / Claude (see server/README.md). Set SUPABASE_* and
  # PUBLIC_URL (this service's https URL) in the dashboard.
  - type: web
    name: fitblueprint-mcp
    runtime: node
    rootDir: server
    branch: claude/training-schedule-ux-7de11g
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: APP_URL
        value: https://ziggbot.github.io/Reserv1/
